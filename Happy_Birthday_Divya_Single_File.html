<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="theme-color" content="#351d40">
  <meta name="description" content="A little birthday surprise made with love for Divya.">
  <title>Happy Birthday Divya — A Birthday Love Letter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>

:root {
  --primary: #e65d75;
  --primary-foreground: #fff7f1;
  --sidebar-primary: #e65d75;
  --sidebar-primary-foreground: #fff7f1;
  --chart-1: #ff9aaa;
  --chart-2: #e65d75;
  --chart-3: #b94e78;
  --chart-4: #763d64;
  --chart-5: #3c2449;
  --radius: 0.65rem;
  --background: #fff9f3;
  --foreground: #231527;
  --card: #fffdf9;
  --card-foreground: #231527;
  --popover: #fffdf9;
  --popover-foreground: #231527;
  --secondary: #f9e9e5;
  --secondary-foreground: #5a3549;
  --muted: #f5e9e3;
  --muted-foreground: #916e79;
  --accent: #ffe0da;
  --accent-foreground: #6a2e4e;
  --destructive: #d84a56;
  --destructive-foreground: #fff;
  --border: #efdcd6;
  --input: #efdcd6;
  --ring: #e65d75;
  --sidebar: #fff9f3;
  --sidebar-foreground: #231527;
  --sidebar-accent: #f9e9e5;
  --sidebar-accent-foreground: #6a2e4e;
  --sidebar-border: #efdcd6;
  --sidebar-ring: #e65d75;
}

html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; background: var(--background); color: var(--foreground); }
button:not(:disabled), a[href] { cursor: pointer; }

:root {
  --ink: #2b1931;
  --plum: #351d40;
  --wine: #6e3157;
  --rose: #ff7d96;
  --cream: #fff5ea;
  --sand: #edd8cd;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

* { box-sizing: border-box; }
::selection { color: #3a1e35; background: #ffc5c2; }

.birthday-page {
  position: relative;
  overflow: hidden;
  background: var(--cream);
  color: var(--ink);
  font-family: "DM Sans", sans-serif;
}

.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 30;
  opacity: .085;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}

.site-nav {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(1240px, calc(100% - 80px));
  margin: 0 auto;
  padding: 31px 0;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.brand-mark, .nav-link { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; transition: opacity .2s ease; }
.brand-mark:hover, .nav-link:hover { opacity: .65; }
.brand-heart { display: grid; width: 28px; height: 28px; place-items: center; border: 1px solid currentColor; border-radius: 50%; color: var(--rose); }
.nav-meta { display: flex; align-items: center; gap: 9px; opacity: .58; }
.nav-dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 4px rgba(255,125,150,.12); }
.nav-link { color: var(--ink); opacity: .72; }

.hero-section {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(380px, 470px);
  align-items: center;
  gap: clamp(50px, 8vw, 140px);
  min-height: 780px;
  padding: 140px max(40px, calc((100% - 1110px) / 2)) 90px;
  background:
    radial-gradient(circle at 77% 35%, rgba(255,152,161,.27), transparent 23%),
    radial-gradient(circle at 22% 100%, rgba(242,188,182,.19), transparent 26%),
    linear-gradient(135deg, #fff7ec 0%, #fceee9 46%, #f5dfe0 100%);
}
.hero-section::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 120px; background: linear-gradient(to bottom, transparent, var(--cream)); pointer-events: none; }
.hero-copy { position: relative; z-index: 1; max-width: 650px; padding-bottom: 42px; }
.eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 23px; color: #a54d64; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
.eyebrow svg { color: var(--rose); }
.hero-title, .section-title, .note-modal h2, .wish-modal h2 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; letter-spacing: -.045em; }
.hero-title { max-width: 670px; margin: 0; color: var(--plum); font-size: clamp(67px, 8.8vw, 130px); line-height: .88; }
.hero-title em, .section-title em, .note-modal h2 em, .wish-modal h2 em { color: var(--rose); font-style: italic; }
.hero-subtitle { margin: 30px 0 0; color: #704d5b; font-size: 15px; line-height: 1.75; letter-spacing: .015em; }
.hero-actions { display: flex; align-items: center; gap: 27px; margin-top: 36px; }
.primary-button, .wish-button { display: inline-flex; align-items: center; justify-content: center; gap: 11px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--plum); box-shadow: 0 12px 24px rgba(53,29,64,.16); color: #fff7f1; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; transition: transform .16s var(--ease-out), box-shadow .2s ease, background .2s ease; }
.primary-button:hover, .wish-button:hover { background: #5a2d5b; box-shadow: 0 15px 30px rgba(53,29,64,.22); transform: translateY(-2px); }
.primary-button:active, .wish-button:active, .text-button:active { transform: scale(.97); }
.text-button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 0; border: 0; background: none; color: #704d5b; font-family: inherit; font-size: 12px; font-weight: 600; transition: color .2s ease, transform .16s var(--ease-out); }
.text-button:hover { color: var(--rose); }
.text-button svg { color: var(--rose); }
.hero-portrait-wrap { position: relative; z-index: 1; align-self: end; width: min(100%, 430px); justify-self: end; padding: 18px 20px 52px; }
.hero-portrait-frame { position: relative; z-index: 1; aspect-ratio: .86; overflow: hidden; border: 10px solid #fffaf4; box-shadow: 0 23px 56px rgba(96,49,62,.22), 9px 11px 0 rgba(255,255,255,.56); transform: rotate(3.2deg); }
.hero-portrait-frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(155deg, rgba(255,247,232,.16), transparent 42%, rgba(72,24,54,.16)); pointer-events: none; }
.hero-portrait-frame img { width: 100%; height: 100%; display: block; object-fit: cover; filter: saturate(.88) contrast(.98); }
.portrait-shadow { position: absolute; z-index: 0; inset: 65px 0 28px 32px; border-radius: 55% 45% 48% 52%; background: rgba(216,105,119,.28); filter: blur(34px); transform: rotate(-10deg); }
.portrait-sticker { position: absolute; z-index: 2; bottom: 22px; left: -28px; display: grid; place-content: center; width: 94px; height: 94px; border-radius: 50%; background: #ffc8bf; box-shadow: 4px 8px 18px rgba(130,59,76,.18); color: #6f3153; font-family: "DM Serif Display", serif; font-size: 12px; line-height: 1.02; text-align: center; transform: rotate(-13deg); }
.portrait-sticker strong { font-size: 21px; font-style: italic; }
.portrait-caption { position: absolute; right: -1px; bottom: 7px; display: flex; align-items: center; gap: 9px; color: #9c6370; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; transform: rotate(3.2deg); }
.caption-line { width: 29px; height: 1px; background: #c8898c; }
.hero-orb { position: absolute; border-radius: 50%; pointer-events: none; }
.hero-orb-one { width: 10px; height: 10px; top: 36%; left: 48%; background: #f9bd99; box-shadow: 0 0 0 8px rgba(249,189,153,.14); }
.hero-orb-two { width: 16px; height: 16px; right: 9%; top: 26%; border: 1px solid rgba(176,96,112,.38); }
.scroll-cue { position: absolute; z-index: 2; bottom: 44px; left: max(40px, calc((100% - 1110px) / 2)); display: flex; align-items: center; gap: 12px; color: #a66b78; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
.scroll-cue svg { animation: nudge 1.7s ease-in-out infinite; }

.intro-section { position: relative; max-width: 1160px; margin: 0 auto; padding: 115px 40px 140px; }
.section-kicker { display: flex; align-items: center; gap: 13px; color: #bb7983; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
.section-kicker > span:first-child { color: var(--rose); font-family: "DM Serif Display", serif; font-size: 18px; letter-spacing: normal; }
.kicker-line { width: 45px; height: 1px; background: #e6b6b2; }
.intro-grid { display: grid; grid-template-columns: 1.15fr .85fr; align-items: end; gap: 80px; margin-top: 55px; }
.eyebrow.warm { color: #bd6e78; }
.section-title { margin: 0; color: var(--plum); font-size: clamp(54px, 6vw, 84px); line-height: .93; }
.intro-aside { max-width: 310px; padding-bottom: 2px; }
.intro-aside p { margin: 0; color: #805965; font-size: 14px; line-height: 1.75; }
.intro-aside p em { color: #c45c74; font-family: "DM Serif Display", serif; font-size: 19px; }
.hand-note { display: flex; align-items: center; gap: 8px; margin-top: 20px; color: #c07480; font-family: "DM Serif Display", serif; font-size: 17px; font-style: italic; transform: rotate(-3deg); }
.memory-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 42px 23px; margin-top: 84px; }
.memory-card { display: flex; flex-direction: column; min-width: 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.memory-card-tall { grid-column: span 4; }
.memory-card-wide { grid-column: span 5; margin-top: 80px; }
.memory-card-mid { grid-column: span 3; margin-top: 26px; }
.memory-image-wrap { position: relative; display: block; overflow: hidden; background: #ead8d0; }
.memory-card-tall .memory-image-wrap { aspect-ratio: .79; }
.memory-card-wide .memory-image-wrap { aspect-ratio: 1.2; }
.memory-card-mid .memory-image-wrap { aspect-ratio: .85; }
.memory-image-wrap::after { content: ""; position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.34); pointer-events: none; }
.memory-image-wrap img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.8) contrast(.98); transition: transform .7s var(--ease-out), filter .4s ease; }
.memory-card:hover .memory-image-wrap img { transform: scale(1.055); filter: saturate(1) contrast(1.02); }
.memory-overlay { position: absolute; right: 13px; bottom: 13px; display: grid; width: 37px; height: 37px; place-items: center; border-radius: 50%; background: rgba(255,250,242,.88); color: var(--plum); opacity: 0; transform: translateY(5px); transition: opacity .25s ease, transform .25s var(--ease-out); }
.memory-card:hover .memory-overlay { opacity: 1; transform: translateY(0); }
.memory-info { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 13px; }
.memory-caption { color: var(--plum); font-family: "DM Serif Display", serif; font-size: 18px; }
.memory-note { color: #a8797f; font-size: 9px; letter-spacing: .04em; text-align: right; }

.letter-section { position: relative; overflow: hidden; padding: 105px max(40px, calc((100% - 1080px) / 2)) 125px; background: #351d40; color: #fff5ea; }
.letter-section::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 75% 40%, rgba(241,123,142,.25), transparent 32%), radial-gradient(circle at 13% 75%, rgba(137,77,153,.24), transparent 26%); pointer-events: none; }
.letter-section::after { content: "♡"; position: absolute; right: 5%; top: 19%; color: rgba(255,222,215,.08); font-family: Georgia, serif; font-size: 260px; line-height: 1; pointer-events: none; }
.section-kicker.light { position: relative; z-index: 1; color: #cfa6b1; }
.section-kicker.light > span:first-child { color: #ff879d; }
.section-kicker.light .kicker-line { background: #7e526e; }
.letter-layout { position: relative; z-index: 1; display: grid; grid-template-columns: .8fr 1.2fr; align-items: center; gap: clamp(65px, 10vw, 150px); margin-top: 60px; }
.light-eyebrow { color: #e7b4ba; }
.letter-heading { position: relative; }
.light-title { color: #fff3e8; }
.letter-seal { display: grid; width: 60px; height: 60px; place-items: center; margin-top: 43px; border: 1px solid #a87088; border-radius: 50%; color: #ff7d96; transform: rotate(-13deg); }
.letter-card { position: relative; padding: 44px 47px 43px; border: 1px solid rgba(255,215,207,.2); background: rgba(255,246,235,.08); box-shadow: 18px 23px 0 rgba(116,57,93,.25); backdrop-filter: blur(10px); }
.letter-card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(255,215,207,.1); pointer-events: none; }
.letter-card-top { position: relative; display: flex; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid rgba(255,215,207,.18); color: #cf9ba7; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
.letter-card p { position: relative; max-width: 560px; margin: 25px 0 0; color: #faeae3; font-family: "DM Serif Display", serif; font-size: 21px; line-height: 1.45; }
.signature { position: relative; margin-top: 33px; color: #ff9aac; font-family: "DM Serif Display", serif; font-size: 20px; font-style: italic; }
.signature span { margin-left: 6px; color: #ff7d96; font-family: Georgia, serif; font-size: 28px; font-style: normal; }

.wish-section { padding: 140px 40px; background: var(--cream); }
.wish-card { position: relative; max-width: 820px; margin: 0 auto; padding: 78px 30px 72px; border: 1px solid #efd6d0; background: linear-gradient(145deg, #fffdf9, #fff0ed); box-shadow: 0 24px 80px rgba(123,64,74,.1); text-align: center; }
.wish-card::before, .wish-card::after { content: ""; position: absolute; width: 70px; height: 70px; border: 1px solid #f1c2ba; }
.wish-card::before { top: 17px; left: 17px; border-right: 0; border-bottom: 0; }
.wish-card::after { right: 17px; bottom: 17px; border-top: 0; border-left: 0; }
.wish-icon { display: grid; width: 57px; height: 57px; place-items: center; margin: 0 auto 29px; border-radius: 50%; background: #ffd9d1; color: #be5570; transform: rotate(-9deg); }
.centered { justify-content: center; text-align: center; }
.wish-copy { margin: 25px 0 31px; color: #8a5a66; font-size: 14px; line-height: 1.7; }
.wish-button { background: var(--rose); box-shadow: 0 13px 28px rgba(230,93,117,.24); }
.wish-button:hover { background: #e56780; }

.site-footer { display: grid; place-items: center; gap: 11px; padding: 35px 30px 43px; border-top: 1px solid #efdcd6; background: #fff9f3; color: #af7880; font-size: 10px; letter-spacing: .11em; text-align: center; text-transform: uppercase; }
.site-footer p { margin: 0; }
.site-footer > span { color: #ce9ba0; font-family: "DM Serif Display", serif; font-size: 16px; letter-spacing: normal; text-transform: none; }
.footer-heart { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid #efb9b5; border-radius: 50%; color: var(--rose); }

.floating-hearts { position: fixed; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
.floating-hearts span { position: absolute; bottom: -30px; color: rgba(229,97,121,.26); animation: float-up linear infinite; }

.modal-backdrop { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; padding: 30px; background: rgba(32,15,37,.78); backdrop-filter: blur(13px); animation: fade-in .24s ease both; }
.photo-modal { position: relative; width: min(700px, 100%); max-height: calc(100vh - 60px); padding: 14px; background: #fff8ef; box-shadow: 0 25px 90px rgba(18,7,22,.45); animation: modal-in .3s var(--ease-out) both; }
.modal-image-wrap { height: min(69vh, 620px); background: #e9d8d0; }
.modal-image-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; }
.icon-button { display: grid; width: 35px; height: 35px; place-items: center; padding: 0; border: 1px solid rgba(117,55,75,.2); border-radius: 50%; background: #fffaf4; color: #65324b; transition: transform .16s var(--ease-out), background .2s ease; }
.icon-button:hover { background: #ffe3dc; transform: scale(1.06); }
.modal-close { position: absolute; z-index: 2; top: 25px; right: 25px; }
.modal-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 6px 2px; }
.modal-footer p { margin: 0 0 4px; color: var(--plum); font-family: "DM Serif Display", serif; font-size: 21px; }
.modal-footer span { color: #a3747b; font-size: 10px; letter-spacing: .05em; }
.modal-controls { display: flex; align-items: center; gap: 13px; }
.modal-controls > span { min-width: 46px; color: #a3747b; font-size: 10px; text-align: center; }
.note-backdrop { background: rgba(36,15,40,.7); }
.note-modal { position: relative; width: min(580px, 100%); padding: 65px 72px 62px; background: #fff1e7; box-shadow: 13px 15px 0 rgba(255,152,156,.38), 0 25px 90px rgba(18,7,22,.35); transform: rotate(-1.3deg); animation: modal-in .3s var(--ease-out) both; }
.note-modal::before { content: ""; position: absolute; inset: 14px; border: 1px solid #efc9c0; pointer-events: none; }
.note-mini-icon { display: grid; width: 39px; height: 39px; place-items: center; margin-bottom: 26px; border-radius: 50%; background: #ffd5cf; color: #bb5270; }
.note-modal .eyebrow { margin-bottom: 13px; }
.note-modal h2, .wish-modal h2 { margin: 0; color: var(--plum); font-size: clamp(43px, 6vw, 61px); line-height: .95; }
.note-body { max-width: 420px; margin: 28px 0 0; color: #795362; font-family: "DM Serif Display", serif; font-size: 19px; line-height: 1.45; }
.wish-backdrop { background: rgba(48,19,55,.87); }
.wish-modal { position: relative; width: min(620px, 100%); padding: 70px 52px 55px; border: 1px solid rgba(255,209,207,.25); background: radial-gradient(circle at 50% 0%, rgba(249,128,150,.24), transparent 42%), #3b2147; box-shadow: 0 30px 100px rgba(13,4,18,.5); color: #fff5e9; text-align: center; animation: modal-in .3s var(--ease-out) both; }
.wish-modal .modal-close { top: 22px; right: 22px; border-color: rgba(255,220,218,.3); background: rgba(255,255,255,.08); color: #ffe8dd; }
.wish-stars { display: grid; width: 58px; height: 58px; place-items: center; margin: 0 auto 28px; border: 1px solid #ba758d; border-radius: 50%; color: #ff9aae; }
.wish-modal .light-eyebrow { justify-content: center; color: #e5b3b9; }
.wish-modal h2 { color: #fff3e7; }
.wish-list { max-width: 390px; margin: 32px auto 29px; border-top: 1px solid rgba(255,217,210,.18); text-align: left; }
.wish-list p { display: flex; gap: 17px; margin: 0; padding: 15px 0; border-bottom: 1px solid rgba(255,217,210,.18); color: #f1dcd7; font-family: "DM Serif Display", serif; font-size: 17px; }
.wish-list span { color: #ff8ea1; font-family: "DM Sans", sans-serif; font-size: 9px; letter-spacing: .1em; }
.centered-button { margin: 0 auto; border: none; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -20px; width: 7px; height: 18px; border-radius: 2px; animation: confetti-fall 2.1s linear both; }

.reveal { animation: reveal-up .85s var(--ease-out) both; }
.reveal-one { animation-delay: .12s; }
.reveal-two { animation-delay: .23s; }
.reveal-three { animation-delay: .35s; }
.reveal-four { animation-delay: .46s; }
.reveal-five { animation-delay: .26s; }

@keyframes reveal-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes modal-in { from { opacity: 0; transform: translateY(15px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
@keyframes float-up { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 12% { opacity: 1; } 85% { opacity: .6; } 100% { transform: translateY(-105vh) rotate(22deg); opacity: 0; } }
@keyframes confetti-fall { 0% { transform: translateY(-20px) rotate(0); opacity: 0; } 8% { opacity: 1; } 100% { transform: translateY(105vh) rotate(620deg); opacity: 0; } }

@media (max-width: 900px) {
  .site-nav { width: calc(100% - 48px); }
  .nav-meta { display: none; }
  .hero-section { grid-template-columns: minmax(0, 1fr) minmax(300px, 38vw); gap: 35px; padding-right: 40px; padding-left: 40px; }
  .hero-title { font-size: clamp(64px, 10vw, 100px); }
  .memory-grid { gap: 35px 16px; }
  .memory-card-tall { grid-column: span 5; }
  .memory-card-wide { grid-column: span 7; }
  .memory-card-mid { grid-column: span 4; }
  .letter-layout { gap: 45px; }
}

@media (max-width: 680px) {
  .site-nav { width: calc(100% - 36px); padding-top: 22px; }
  .brand-mark span:last-child, .nav-link { font-size: 9px; }
  .hero-section { display: block; min-height: auto; padding: 144px 22px 105px; }
  .hero-copy { padding-bottom: 52px; }
  .hero-title { max-width: 100%; font-size: clamp(61px, 17.5vw, 90px); overflow-wrap: normal; }
  .hero-title em { display: block; }
  .hero-subtitle { font-size: 13px; }
  .hero-portrait-wrap { width: min(82vw, 355px); margin: 0 auto; padding-bottom: 48px; }
  .scroll-cue { bottom: 28px; left: 22px; font-size: 8px; }
  .intro-section { padding: 82px 22px 95px; }
  .intro-grid { display: block; margin-top: 40px; }
  .section-title { font-size: clamp(52px, 15vw, 77px); }
  .intro-aside { max-width: 345px; margin-top: 30px; }
  .memory-grid { grid-template-columns: repeat(2, 1fr); gap: 31px 12px; margin-top: 56px; }
  .memory-card-tall, .memory-card-wide, .memory-card-mid { grid-column: span 1; margin-top: 0; }
  .memory-card-wide:nth-child(2), .memory-card-wide:nth-child(5), .memory-card-wide:nth-child(8) { grid-column: span 2; }
  .memory-card-wide .memory-image-wrap { aspect-ratio: 1.3; }
  .memory-info { display: block; margin-top: 9px; }
  .memory-caption { display: block; font-size: 16px; }
  .memory-note { display: block; margin-top: 3px; text-align: left; font-size: 8px; }
  .letter-section { padding: 82px 22px 93px; }
  .letter-layout { display: block; margin-top: 48px; }
  .letter-seal { margin-top: 30px; }
  .letter-card { margin-top: 48px; padding: 35px 27px 36px; }
  .letter-card p { font-size: 18px; }
  .letter-card-top { font-size: 8px; }
  .wish-section { padding: 86px 22px; }
  .wish-card { padding: 63px 21px 59px; }
  .wish-copy { font-size: 13px; }
  .note-modal { padding: 60px 32px 50px; }
  .wish-modal { padding: 65px 25px 45px; }
  .wish-list p { font-size: 15px; }
  .modal-backdrop { padding: 16px; }
  .photo-modal { padding: 9px; }
  .modal-image-wrap { height: min(67vh, 560px); }
  .modal-footer { padding: 14px 4px 1px; }
  .modal-footer p { font-size: 18px; }
  .modal-controls { gap: 7px; }
  .desktop-break { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>
  <div id="app"></div>
  <script>
const photos = [
  {src:"https://i.ibb.co/Pz63rtN0/Screenshot-20260919-195730.jpg",alt:"A precious birthday memory",caption:"Tumhari smile",note:"bas, meri favourite cheez",className:"memory-card memory-card-tall"},
  {src:"https://i.ibb.co/x8sG8QBW/Screenshot-20260919-195723.jpg",alt:"A shared moment together",caption:"Little moments",note:"jo dil mein reh jaate hain",className:"memory-card memory-card-wide"},
  {src:"https://i.ibb.co/Q7ZPq9dN/Screenshot-20260919-195713.jpg",alt:"A beautiful memory",caption:"You, being you",note:"aur duniya thodi aur pretty",className:"memory-card memory-card-mid"},
  {src:"https://i.ibb.co/7dL8QsRs/Screenshot-20260919-195653.jpg",alt:"A sweet memory together",caption:"Our kind of chaos",note:"perfectly imperfect",className:"memory-card memory-card-mid"},
  {src:"https://i.ibb.co/GfSbqwmd/Screenshot-20260919-195640.jpg",alt:"A joyful shared memory",caption:"Soft days",note:"with my softest person",className:"memory-card memory-card-wide"},
  {src:"https://i.ibb.co/Ndh9z8Xn/Screenshot-20260919-195629.jpg",alt:"A meaningful memory",caption:"Just us",note:"no filter needed",className:"memory-card memory-card-tall"},
  {src:"https://i.ibb.co/VW8YcbrC/Screenshot-20260919-195602.jpg",alt:"A warm memory",caption:"The good stuff",note:"jo calendar mein nahi, dil mein hota hai",className:"memory-card memory-card-mid"},
  {src:"https://i.ibb.co/HfgLFpRb/Screenshot-20260919-195551.jpg",alt:"A lovely moment",caption:"Golden hour",note:"even when the sky isn't",className:"memory-card memory-card-wide"},
  {src:"https://i.ibb.co/YTTVq85Y/Screenshot-20260919-195545.jpg",alt:"A special memory",caption:"My favourite chapter",note:"still writing it with you",className:"memory-card memory-card-mid"},
  {src:"https://i.ibb.co/dJ0D843x/Screenshot-20260919-195540.jpg",alt:"A cherished moment",caption:"Forever mood",note:"happy birthday, love",className:"memory-card memory-card-mid"}
];

const wishes = [
  "Tumhari har subah thodi aur bright ho.",
  "Tum jitna pyaar deti ho, usse bhi zyada tumhe mile.",
  "Aur hum dono ke paas aise hi hazaar memories ho."
];

const icons = {
  heart: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg>',
  stars: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M19 3v4M21 5h-4M5 16v5M7.5 18.5h-5"/></svg>',
  sparkles: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.5 5.5L5 10l5.5 1.5L12 17l1.5-5.5L19 10l-5.5-1.5L12 3Z"/><path d="m19 16-.7 2.3L16 19l2.3.7L19 22l.7-2.3L22 19l-2.3-.7L19 16Z"/></svg>',
  arrowDown: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>',
  arrowUpRight: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  chevronLeft: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  chevronRight: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  gift: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8H7.5a2.5 2.5 0 1 1 0-5C10 3 12 8 12 8Zm0 0h4.5a2.5 2.5 0 1 0 0-5C14 3 12 8 12 8Z"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>'
};

const I = (name) => icons[name];

function floatingHearts() {
  return `<div class="floating-hearts" aria-hidden="true">${
    Array.from({length:18},(_,index)=>`<span style="left:${(index*17+4)%100}%;animation-delay:${(index%7)*1.1}s;animation-duration:${8+(index%5)*1.4}s;font-size:${10+(index%4)*4}px">♥</span>`).join("")
  }</div>`;
}

function confetti() {
  return `<div class="confetti" aria-hidden="true">${
    Array.from({length:46},(_,index)=>{
      const colors=["#ff7d96","#ffd37d","#fff2de","#b99cff"];
      return `<i style="left:${(index*31)%100}%;animation-delay:${(index%12)*0.07}s;background-color:${colors[index%4]};transform:rotate(${(index*33)%180}deg)"></i>`;
    }).join("")
  }</div>`;
}

const app = document.getElementById("app");
let activePhoto = null;
let wishOpen = false;
let letterOpen = false;
let celebration = false;
let celebrationTimer = null;

function render() {
  app.innerHTML = `
  <main class="birthday-page">
    ${floatingHearts()}
    <div class="grain" aria-hidden="true"></div>

    <header class="site-nav">
      <a class="brand-mark" href="#top" aria-label="Back to the top">
        <span class="brand-heart">${I("heart")}</span>
        <span>for you, always</span>
      </a>
      <div class="nav-meta"><span class="nav-dot"></span><span>19 · 09 · 2026</span></div>
      <a class="nav-link" href="#memories">our little archive ${I("arrowUpRight")}</a>
    </header>

    <section class="hero-section" id="top">
      <div class="hero-orb hero-orb-one"></div>
      <div class="hero-orb hero-orb-two"></div>
      <div class="hero-copy">
        <p class="eyebrow reveal reveal-one">${I("stars")} Divya&apos;s birthday surprise</p>
        <h1 class="hero-title reveal reveal-two">Happy Birthday,<em>Divya.</em></h1>
        <p class="hero-subtitle reveal reveal-three">A tiny corner of the internet, made with a very big heart—<br class="desktop-break">just for the girl who makes everything feel like home.</p>
        <div class="hero-actions reveal reveal-four">
          <a class="primary-button" href="#memories">Open your surprise ${I("arrowDown")}</a>
          <button class="text-button" id="openLetter">A note for you ${I("heart")}</button>
        </div>
      </div>
      <div class="hero-portrait-wrap reveal reveal-five">
        <div class="portrait-shadow"></div>
        <div class="hero-portrait-frame">
          <img src="${photos[0].src}" alt="${photos[0].alt}">
          <div class="portrait-sticker">made for<br><strong>Divya</strong> ♡</div>
        </div>
        <div class="portrait-caption"><span>Divya&apos;s day</span><span class="caption-line"></span><span>my favourite person</span></div>
      </div>
      <div class="scroll-cue"><span>scroll to wander through our memories</span>${I("arrowDown")}</div>
    </section>

    <section class="intro-section" id="memories">
      <div class="section-kicker"><span>01</span><span class="kicker-line"></span><span>the archive</span></div>
      <div class="intro-grid">
        <div>
          <p class="eyebrow warm">${I("sparkles")} every picture tells a feeling</p>
          <h2 class="section-title">Some moments are<br><em>too good to forget.</em></h2>
        </div>
        <div class="intro-aside">
          <p>In a world full of ordinary days, you make the small ones feel special. Here are a few of my favourite little pieces of <em>us.</em></p>
          <span class="hand-note">keep scrolling, cutie ${I("heart")}</span>
        </div>
      </div>
      <div class="memory-grid">
        ${photos.map((photo,index)=>`
          <button class="${photo.className}" data-photo="${index}" aria-label="Open memory: ${photo.caption}">
            <span class="memory-image-wrap">
              <img src="${photo.src}" alt="${photo.alt}" ${index>2?'loading="lazy"':''}>
              <span class="memory-overlay">${I("arrowUpRight")}</span>
            </span>
            <span class="memory-info"><span class="memory-caption">${photo.caption}</span><span class="memory-note">${photo.note}</span></span>
          </button>`).join("")}
      </div>
    </section>

    <section class="letter-section">
      <div class="letter-glow"></div>
      <div class="section-kicker light"><span>02</span><span class="kicker-line"></span><span>from my heart</span></div>
      <div class="letter-layout">
        <div class="letter-heading">
          <p class="eyebrow light-eyebrow">${I("heart")} if you ever forget</p>
          <h2 class="section-title light-title">You are<br><em>so loved.</em></h2>
          <div class="letter-seal">${I("heart")}</div>
        </div>
        <div class="letter-card">
          <div class="letter-card-top"><span>dear Divya,</span><span>19 / 09 / 26</span></div>
          <p>You have this beautiful way of making life warmer without even trying. Thank you for being my favourite person to laugh with, dream with, and do absolutely nothing with.</p>
          <p>I hope this year gives you every soft, silly, wonderful thing you deserve. And whenever the days get loud, I hope you remember: you will always have my whole heart.</p>
          <div class="signature">always yours <span>♡</span></div>
        </div>
      </div>
    </section>

    <section class="wish-section">
      <div class="wish-card">
        <div class="wish-icon">${I("gift")}</div>
        <p class="eyebrow warm centered">${I("stars")} one last thing</p>
        <h2 class="section-title centered">Make a wish,<br><em>my love.</em></h2>
        <p class="wish-copy">Close your eyes, think of something beautiful,<br class="desktop-break"> and let the universe know you are ready for it.</p>
        <button class="wish-button" id="makeWish">Make my wish ${I("sparkles")}</button>
      </div>
    </section>

    <footer class="site-footer">
      <div class="footer-heart">${I("heart")}</div>
      <p>made for Divya, who makes my world softer</p>
      <span>with love, always</span>
    </footer>

    ${activePhoto !== null ? `
      <div class="modal-backdrop" id="photoBackdrop" role="dialog" aria-modal="true" aria-label="Memory viewer">
        <div class="photo-modal">
          <button class="icon-button modal-close" id="closePhoto" aria-label="Close memory viewer">${I("x")}</button>
          <div class="modal-image-wrap"><img src="${photos[activePhoto].src}" alt="${photos[activePhoto].alt}"></div>
          <div class="modal-footer">
            <div><p>${photos[activePhoto].caption}</p><span>${photos[activePhoto].note}</span></div>
            <div class="modal-controls">
              <button class="icon-button" id="previousPhoto" aria-label="Previous memory">${I("chevronLeft")}</button>
              <span>${String(activePhoto+1).padStart(2,"0")} / ${String(photos.length).padStart(2,"0")}</span>
              <button class="icon-button" id="nextPhoto" aria-label="Next memory">${I("chevronRight")}</button>
            </div>
          </div>
        </div>
      </div>` : ""}

    ${letterOpen ? `
      <div class="modal-backdrop note-backdrop" id="letterBackdrop" role="dialog" aria-modal="true" aria-label="Birthday note">
        <div class="note-modal">
          <button class="icon-button modal-close" id="closeLetter" aria-label="Close note">${I("x")}</button>
          <span class="note-mini-icon">${I("heart")}</span>
          <p class="eyebrow warm">a little note for Divya</p>
          <h2>For the girl who makes<br><em>every day feel lighter.</em></h2>
          <p class="note-body">I don&apos;t need a special day to celebrate you—but I am very glad today gives me an excuse to remind you how incredible you are.</p>
          <div class="signature">love you, silly <span>♡</span></div>
        </div>
      </div>` : ""}

    ${wishOpen ? `
      <div class="modal-backdrop wish-backdrop" id="wishBackdrop" role="dialog" aria-modal="true" aria-label="Birthday wish">
        ${celebration ? confetti() : ""}
        <div class="wish-modal">
          <button class="icon-button modal-close" id="closeWish" aria-label="Close wish">${I("x")}</button>
          <div class="wish-stars">${I("stars")}</div>
          <p class="eyebrow light-eyebrow centered">wish sent to the universe</p>
          <h2>May this be your<br><em>best year yet.</em></h2>
          <div class="wish-list">${wishes.map((wish,index)=>`<p><span>0${index+1}</span>${wish}</p>`).join("")}</div>
          <button class="primary-button centered-button" id="takeWish">I’ll take it ${I("heart")}</button>
        </div>
      </div>` : ""}
  </main>`;
  bind();
}

function setBodyLock() {
  document.body.style.overflow = (activePhoto !== null || wishOpen) ? "hidden" : "";
}

function bind() {
  document.querySelectorAll("[data-photo]").forEach(el => {
    el.addEventListener("click", () => { activePhoto = Number(el.dataset.photo); render(); });
  });

  document.getElementById("openLetter")?.addEventListener("click", () => { letterOpen = true; render(); });
  document.getElementById("makeWish")?.addEventListener("click", () => {
    wishOpen = true;
    celebration = true;
    render();
    clearTimeout(celebrationTimer);
    celebrationTimer = setTimeout(() => { celebration = false; render(); }, 2200);
  });

  document.getElementById("closePhoto")?.addEventListener("click", () => { activePhoto = null; render(); });
  document.getElementById("previousPhoto")?.addEventListener("click", () => {
    if (activePhoto !== null) activePhoto = (activePhoto - 1 + photos.length) % photos.length;
    render();
  });
  document.getElementById("nextPhoto")?.addEventListener("click", () => {
    if (activePhoto !== null) activePhoto = (activePhoto + 1) % photos.length;
    render();
  });
  document.getElementById("closeLetter")?.addEventListener("click", () => { letterOpen = false; render(); });
  document.getElementById("closeWish")?.addEventListener("click", () => { wishOpen = false; render(); });
  document.getElementById("takeWish")?.addEventListener("click", () => { wishOpen = false; render(); });

  document.getElementById("photoBackdrop")?.addEventListener("click", e => {
    if (e.target.id === "photoBackdrop") { activePhoto = null; render(); }
  });
  document.getElementById("letterBackdrop")?.addEventListener("click", e => {
    if (e.target.id === "letterBackdrop") { letterOpen = false; render(); }
  });
  document.getElementById("wishBackdrop")?.addEventListener("click", e => {
    if (e.target.id === "wishBackdrop") { wishOpen = false; render(); }
  });

  setBodyLock();
}

render();

</script>
</body>
</html>
